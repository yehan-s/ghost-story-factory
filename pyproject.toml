[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-story-factory"
version = "2.0.0"
description = "VN 沙盒播放器 — 自带《杭州夜班保安》剧本"
readme = "README.md"
authors = [
    { name = "yehan-s" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["visual-novel", "tui", "textual", "interactive-fiction", "horror"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
]

# 运行时只需要 textual(全屏 TUI)+ rich(终端格式化)。
# LLM 生成流水线代码已归档到 `legacy/llm-pipeline` 分支,不再是依赖。
dependencies = [
    "textual>=8.0",
    "rich>=13.7.0",
]

[project.scripts]
# 唯一入口:全屏 TUI 播放器
ghost-story-tui = "ghost_story_factory.v7.tui_player:main"

[project.urls]
Homepage = "https://github.com/yehan-s/ghost-story-factory"
"Bug Tracker" = "https://github.com/yehan-s/ghost-story-factory/issues"
"Legacy LLM Pipeline" = "https://github.com/yehan-s/ghost-story-factory/tree/legacy/llm-pipeline"

# src layout
[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

# 注:剧本数据(stories/)目前从 repo 根目录加载,装包路径处理留给 Step 3(release)
